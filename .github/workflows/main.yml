# ============================================================================
# YouTube Shorts Auto Upload - Production Workflow (Optimized)
# ============================================================================
# Author: Ayoub Ait Bella
# Version: 2.1.0 (Fixed Discord Logic)
# ============================================================================

name: 🚀 YouTube Shorts Auto Upload

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force_upload:
        description: 'Force upload even if no new videos'
        required: false
        default: false
        type: boolean
      video_limit:
        description: 'Maximum videos to upload'
        required: false
        default: 5
        type: number
  push:
    paths:
      - 'videos/**/*.mp4'
      - 'stories/**/*.txt'
    branches:
      - main
      - master

env:
  PYTHON_VERSION: '3.11'
  MAX_VIDEOS_PER_RUN: 10
  UPLOAD_RETRY_COUNT: 3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 🔍 Validate Environment
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check_secrets.outputs.has_secrets }}
      should_run: ${{ steps.check_conditions.outputs.should_run }}
    steps:
      - name: 🔑 Check YouTube Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.YOUTUBE_TOKEN_JSON }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 📊 Check Run Conditions
        id: check_conditions
        run: |
          SHOULD_RUN="true"
          if [ "${{ steps.check_secrets.outputs.has_secrets }}" = "false" ] && \
             [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            SHOULD_RUN="false"
          fi
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

  generate:
    name: 🎬 Generate Shorts
    needs: validate
    if: needs.validate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 🔧 Install System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-arabic fonts-noto-color-emoji
      
      - name: 📦 Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib opencv-python numpy Pillow arabic-reshaper python-bidi moviepy tenacity tqdm
      
      - name: 🎥 Generate Videos
        id: generate
        run: |
          mkdir -p videos temp
          python shorts_factory.py
          VIDEO_COUNT=$(find videos -name "*.mp4" | wc -l)
          echo "video_count=$VIDEO_COUNT" >> $GITHUB_OUTPUT
      
      - name: 💾 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-videos
          path: videos/*.mp4
          retention-days: 1

  upload:
    name: 📤 Upload to YouTube
    needs: [validate, generate]
    if: needs.validate.outputs.has_secrets == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        video: [0, 1, 2, 3, 4] # تعديل القائمة بناءً على حاجتك
    steps:
      - name: 📥 Download Videos
        uses: actions/download-artifact@v4
        with:
          name: generated-videos
          path: ./videos
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🚀 Upload Process
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          pip install google-api-python-client google-auth-oauthlib tenacity
          python upload_bot.py --video-index ${{ matrix.video }}

  cleanup:
    name: 🧹 Cleanup
    needs: [generate, upload]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 🗑️ Clear Cache
        run: echo "Cleaning up runner resources..."

  notify:
    name: 📧 Notifications
    needs: [generate, upload]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📧 Discord Notification
        # تم إصلاح الخطأ هنا باستخدام الأقواس الصحيحة
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: "🚀 YouTube Workflow Completed! Generated: ${{ needs.generate.outputs.video_count }} videos."
