name: YouTube Shorts Auto Upload (Conda)

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: 3.11
          activate-environment: youtube-bot
          auto-activate-base: false

      - name: 📦 Install Dependencies with Conda
        shell: bash -l {0}
        run: |
          # Install system dependencies
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
          # Install Python packages with conda
          conda install -c conda-forge opencv numpy pillow imageio imageio-ffmpeg -y
          
          # Install pip packages
          pip install google-api-python-client==2.129.0
          pip install google-auth==2.29.0
          pip install google-auth-httplib2==0.2.0
          pip install google-auth-oauthlib==1.2.0
          pip install moviepy==1.0.3
          pip install arabic-reshaper==3.0.0
          pip install python-bidi==0.4.2
          pip install tqdm==4.66.2
          
          # Verify installation
          python -c "import pkg_resources; print('✅ OK')"

      - name: 🎬 Generate Shorts Video
        shell: bash -l {0}
        run: |
          echo "🎬 Starting video generation at $(date)"
          python shorts_factory.py

      - name: 🚀 Upload to YouTube Shorts
        shell: bash -l {0}
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python upload_bot.py
