name: YouTube Shorts Auto Upload

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'videos/**'
      - 'shorts_factory.py'
      - 'upload_bot.py'
      - 'requirements.txt'

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      PYTHONUNBUFFERED: 1

    steps:
      # ============================================
      # 1. CHECKOUT CODE
      # ============================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================
      # 2. SETUP PYTHON ENVIRONMENT
      # ============================================
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # ============================================
      # 3. INSTALL DEPENDENCIES (Fixed)
      # ============================================
      - name: 📦 Install Dependencies
        run: |
          # Upgrade pip and install setuptools first (critical for pkg_resources)
          python -m pip install --upgrade pip setuptools wheel
          
          # Install all requirements
          pip install -r requirements.txt
          
          # Force reinstall imageio-ffmpeg with dependencies
          pip install --upgrade --force-reinstall imageio-ffmpeg
          
          # Verify critical imports
          python -c "import pkg_resources; print('✅ pkg_resources available')"
          python -c "import cv2; print(f'✅ OpenCV: {cv2.__version__}')"
          python -c "import numpy; print(f'✅ NumPy: {numpy.__version__}')"
          python -c "import PIL; print(f'✅ Pillow: {PIL.__version__}')"
          python -c "from moviepy.editor import VideoFileClip; print(f'✅ MoviePy: OK')"
          python -c "import arabic_reshaper; print('✅ Arabic Reshaper: OK')"
          python -c "from bidi.algorithm import get_display; print('✅ Python-Bidi: OK')"

      # ============================================
      # 4. INSTALL FFMPEG (Required for moviepy)
      # ============================================
      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      # ============================================
      # 6. CREATE VIDEO
      # ============================================
      - name: 🎬 Generate Shorts Video
        run: |
          echo "🎬 Starting video generation at $(date)"
          
          # Debug: Show current directory structure
          echo "📁 Current directory structure:"
          ls -la
          
          # Check required files
          if [ ! -f "shorts_factory.py" ]; then
            echo "❌ shorts_factory.py not found!"
            exit 1
          fi
          
          if [ ! -f "stories.txt" ]; then
            echo "❌ stories.txt not found!"
            exit 1
          fi
          
          if [ ! -f "andalus.ttf" ]; then
            echo "⚠️ Warning: andalus.ttf not found, using default font"
          fi
          
          # Run the video creator
          python shorts_factory.py
          
          if [ $? -eq 0 ]; then
            echo "✅ Video generation completed successfully"
            echo "📁 Generated videos:"
            ls -lah videos/ || echo "No videos found"
          else
            echo "❌ Video generation failed with exit code $?"
            exit 1
          fi

      # ============================================
      # 7. UPLOAD TO YOUTUBE
      # ============================================
      - name: 🚀 Upload to YouTube Shorts
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "❌ YOUTUBE_TOKEN_JSON secret is missing"
            exit 1
          fi
          
          echo "📤 Starting upload process at $(date)"
          
          if python upload_bot.py; then
            echo "✅ Upload completed successfully"
          else
            echo "❌ Upload failed"
            exit 1
          fi

      # ============================================
      # 8. CLEANUP
      # ============================================
      - name: 🧹 Cleanup Video Directory
        if: always()
        run: |
          echo "🧹 Cleaning up video directory..."
          
          if [ -d "videos" ]; then
            find videos/ -type f -name "*.mp4" -delete
            find videos/ -type f -name "*.avi" -delete
            find videos/ -type f -name "*.mov" -delete
            find videos/ -type f -name "*.mkv" -delete
            touch videos/.gitkeep
            echo "✅ Cleanup completed"
          else
            echo "⚠️ Videos directory not found"
          fi

      # ============================================
      # 9. SUCCESS NOTIFICATION
      # ============================================
      - name: ✅ Success Notification
        if: success()
        run: |
          echo "🎉 Workflow completed successfully at $(date)"
          echo "📊 Workflow URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ============================================
      # 10. FAILURE NOTIFICATION
      # ============================================
      - name: 📧 Failure Notification
        if: failure()
        run: |
          echo "❌ Workflow failed at $(date)"
          echo "🔧 Workflow ID: ${{ github.run_id }}"
          echo "📝 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📊 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
