name: YouTube Shorts Auto Upload

on:
  schedule:
    # Runs every 3 hours with random minute offset to avoid detection
    - cron: '*/3 * * * *'
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'videos/**'
      - 'shorts_factory.py'  # Trigger when creator script changes
      - 'upload_bot.py'      # Trigger when upload script changes
      - 'requirements.txt'   # Trigger when dependencies change

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    # Environment variables
    env:
      PYTHONUNBUFFERED: 1  # Real-time Python output

    steps:
      # ============================================
      # 1. CHECKOUT CODE
      # ============================================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Faster clone for CI/CD

      # ============================================
      # 2. SETUP PYTHON ENVIRONMENT
      # ============================================
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # ============================================
      # 3. INSTALL DEPENDENCIES (Using requirements.txt)
      # ============================================
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install --upgrade google-api-python-client google-auth-oauthlib
          
          # Verify installations
          python -c "import cv2; print(f'✅ OpenCV: {cv2.__version__}')"
          python -c "import numpy; print(f'✅ NumPy: {numpy.__version__}')"
          python -c "import PIL; print(f'✅ Pillow: {PIL.__version__}')"
          python -c "import moviepy; print(f'✅ MoviePy: {moviepy.__version__}')"
          python -c "import googleapiclient; print(f'✅ Google API Client: OK')"

      # ============================================
     
      # 5. CREATE VIDEO (Run shorts factory)
      # ============================================
      - name: 🎬 Generate Shorts Video
        run: |
          echo "🎬 Starting video generation at $(date)"
          
          # Run the video creator
          if python shorts_factory.py; then
            echo "✅ Video generation completed successfully"
            
            # List generated videos
            echo "📁 Generated videos:"
            ls -lah videos/ || echo "No videos found in videos/"
          else
            echo "❌ Video generation failed"
            exit 1
          fi

      # ============================================
      # 6. UPLOAD TO YOUTUBE
      # ============================================
      - name: 🚀 Upload to YouTube Shorts
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          # Verify token exists
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "❌ YOUTUBE_TOKEN_JSON secret is missing"
            exit 1
          fi
          
          echo "📤 Starting upload process at $(date)"
          
          # Run upload bot
          if python upload_bot.py; then
            echo "✅ Upload completed successfully"
          else
            echo "❌ Upload failed"
            exit 1
          fi

      # ============================================
      # 7. CLEANUP (Safe deletion with .gitkeep)
      # ============================================
      - name: 🧹 Cleanup Video Directory
        if: always()  # Always run even if previous steps fail
        run: |
          echo "🧹 Cleaning up video directory..."
          
          # Safe deletion of video files
          if [ -d "videos" ]; then
            # Delete only video files, keep .gitkeep
            find videos/ -type f -name "*.mp4" -delete
            find videos/ -type f -name "*.avi" -delete
            find videos/ -type f -name "*.mov" -delete
            find videos/ -type f -name "*.mkv" -delete
            
            # Ensure .gitkeep exists
            touch videos/.gitkeep
            
            echo "✅ Cleanup completed"
            echo "📁 Remaining files:"
            ls -la videos/
          else
            echo "⚠️ Videos directory not found, skipping cleanup"
          fi

      # ============================================
      # 8. SUCCESS NOTIFICATION (Optional)
      # ============================================
      - name: ✅ Success Notification
        if: success()
        run: |
          echo "🎉 Workflow completed successfully at $(date)"
          echo "📊 Workflow URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ============================================
      # 9. FAILURE NOTIFICATION
      # ============================================
      - name: 📧 Failure Notification
        if: failure()
        run: |
          echo "❌ Workflow failed at $(date)"
          echo "🔧 Workflow ID: ${{ github.run_id }}"
          echo "📝 Repository: ${{ github.repository }}"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "📊 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "💡 Common fixes:"
          echo "  1. Check secrets.YOUTUBE_TOKEN_JSON is valid"
          echo "  2. Verify stories.txt has content"
          echo "  3. Check backgrounds/ folder has images"
          echo "  4. Verify andalus.ttf font exists"
          echo "  5. Check disk space with: df -h"

      # ============================================
      # 10. DISK CLEANUP (Optional)
      # ============================================
      - name: 🗑️ Free Disk Space
        if: always()
        run: |
          # Clean up pip cache
          pip cache purge || true
          
          # Clean up temporary files
          rm -rf /tmp/* || true
          
          # Show disk usage
          echo "💾 Disk usage after cleanup:"
          df -h
