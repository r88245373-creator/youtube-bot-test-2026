name: YouTube Shorts Auto Upload

on:
  schedule:
    - cron: '0 */4 * * *' # تم تغييره ليعمل كل ساعتين (أكثر استقراراً من كل 3 دقائق لتجنب حظر يوتيوب)
  workflow_dispatch:
  push:
    paths:
      - 'shorts_factory.py'
      - 'upload_bot.py'
      - 'requirements.txt'

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      PYTHONUNBUFFERED: 1

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 🏗️ Install System Dependencies (Arabic Fix)
        run: |
          sudo apt-get update
          # تثبيت مكتبات الخطوط الأساسية لنظام لينكس لدعم العربية
          sudo apt-get install -y ffmpeg libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 fonts-noto-core fonts-noto-ui-core

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir setuptools==69.5.1
          pip install --no-cache-dir -r requirements.txt
          # تثبيت إضافي لضمان عمل المعالج العربي
          pip install --no-cache-dir arabic-reshaper python-bidi fonttools

      - name: 🎬 Verify Environment
        run: |
          echo "=== VERIFYING SYSTEM ==="
          python -c "import arabic_reshaper; from bidi.algorithm import get_display; print('✅ Arabic Text Logic: OK')"
          ffmpeg -version | head -n 1
          echo "=== CHECKING FONT FILE ==="
          # سيقوم هذا السطر بالتأكد من وجود ملف الخط في المجلد
          ls Andalus.ttf || echo "⚠️ Warning: Andalus.ttf not found in root!"

      - name: 🎬 Generate Shorts Video
        run: |
          echo "🎬 Starting video generation at $(date)"
          python shorts_factory.py
          
          if [ $? -eq 0 ]; then
            echo "✅ Video generation completed successfully"
            ls -lah videos/
          else
            echo "❌ Video generation failed"
            exit 1
          fi

      - name: 🚀 Upload to YouTube Shorts
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "❌ YOUTUBE_TOKEN_JSON secret is missing"
            exit 1
          fi
          python upload_bot.py

      - name: 🧹 Cleanup
        if: always()
        run: |
          find videos/ -type f -name "*.mp4" -delete
          touch videos/.gitkeep
