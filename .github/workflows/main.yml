name: YouTube Shorts Auto-Poster
on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:        # Manual trigger option

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install dependencies
      - name: 📦 Install Requirements
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: 

      # Step 5: Generate Short video
      - name: 🎬 Generate Short Video
        run: |
          echo "🎥 Creating YouTube Short..."
          python shorts_factory.py
        continue-on-error: false

      # Step 6: Upload to YouTube
      - name: 📤 Upload to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }} 
        run: |
          echo "🚀 Uploading Short..."
          python upload_bot.py

      # Step 7: Cleanup (always runs)
      - name: 🧹 Cleanup Videos
        if: always()
        run: |
          rm -rf videos/* || true
          touch videos/.gitkeep
          echo "✨ Cleanup done"
