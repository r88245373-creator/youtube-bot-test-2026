name: YouTube Shorts Auto Upload

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'videos/**'
      - 'shorts_factory.py'
      - 'upload_bot.py'
      - 'requirements.txt'

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      PYTHONUNBUFFERED: 1

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 📦 Install Dependencies (Fixed pkg_resources)
        run: |
          # Upgrade pip first
          python -m pip install --upgrade pip
          
          # CRITICAL: Install setuptools BEFORE any other package
          # This ensures pkg_resources is available
          pip install --no-cache-dir setuptools==69.5.1
          
          # Verify pkg_resources works immediately
          python -c "import pkg_resources; print('✅ pkg_resources loaded successfully')"
          
          # Install all other requirements
          pip install --no-cache-dir -r requirements.txt
          
          # Fix imageio-ffmpeg - keep the working version
          pip install --no-cache-dir --force-reinstall imageio-ffmpeg==0.4.9
          
          # Prevent future setuptools upgrades
          pip install --no-cache-dir --upgrade --force-reinstall setuptools==69.5.1
          
          # Final verification
          echo "=== VERIFYING ALL IMPORTS ==="
          python -c "import pkg_resources; print('✅ pkg_resources')"
          python -c "import cv2; print(f'✅ OpenCV: {cv2.__version__}')"
          python -c "import numpy; print(f'✅ NumPy: {numpy.__version__}')"
          python -c "import PIL; print(f'✅ Pillow: {PIL.__version__}')"
          python -c "import moviepy; print('✅ MoviePy')"
          python -c "import arabic_reshaper; print('✅ Arabic Reshaper')"
          python -c "from bidi.algorithm import get_display; print('✅ Python-Bidi')"
          python -c "import imageio_ffmpeg; print('✅ imageio-ffmpeg')"
          echo "=== ALL VERIFICATIONS PASSED ==="

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: 🎬 Generate Shorts Video
        run: |
          echo "🎬 Starting video generation at $(date)"
          
          # Debug installed packages
          echo "📦 Installed packages:"
          pip list | grep -E "(setuptools|imageio|moviepy|pkg_resources)"
          
          # Run the video creator
          python shorts_factory.py
          
          if [ $? -eq 0 ]; then
            echo "✅ Video generation completed successfully"
            echo "📁 Generated videos:"
            ls -lah videos/ || echo "No videos found"
          else
            echo "❌ Video generation failed"
            exit 1
          fi

      - name: 🚀 Upload to YouTube Shorts
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "❌ YOUTUBE_TOKEN_JSON secret is missing"
            exit 1
          fi
          
          echo "📤 Starting upload process at $(date)"
          
          if python upload_bot.py; then
            echo "✅ Upload completed successfully"
          else
            echo "❌ Upload failed"
            exit 1
          fi

      - name: 🧹 Cleanup Video Directory
        if: always()
        run: |
          echo "🧹 Cleaning up video directory..."
          
          if [ -d "videos" ]; then
            # Keep only the most recent video if needed, delete others
            find videos/ -type f -name "*.mp4" -not -name ".*" -delete
            find videos/ -type f -name "*.avi" -delete
            find videos/ -type f -name "*.mov" -delete
            find videos/ -type f -name "*.mkv" -delete
            touch videos/.gitkeep
            echo "✅ Cleanup completed"
          else
            echo "⚠️ Videos directory not found"
          fi

      - name: ✅ Success Notification
        if: success()
        run: |
          echo "🎉 Workflow completed successfully at $(date)"

      - name: 📧 Failure Notification
        if: failure()
        run: |
          echo "❌ Workflow failed at $(date)"
          echo "📊 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
