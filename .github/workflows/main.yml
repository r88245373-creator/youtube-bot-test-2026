name: 🚀 YouTube Shorts Auto Upload (Pro v2)

on:
schedule:
- cron: '0 */3 * * *'   # كل 3 ساعات (UTC)
workflow_dispatch:
push:
paths:
- 'videos/**'
- 'shorts_factory.py'
- 'upload_bot.py'
- 'requirements.txt'

jobs:
upload:
runs-on: ubuntu-latest
timeout-minutes: 30

```
steps:
  # 1. Checkout
  - name: 📥 Checkout Repository
    uses: actions/checkout@v3

  # 2. Python Setup
  - name: 🐍 Setup Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.11'
      cache: 'pip'

  # 3. Install Dependencies (optimized)
  - name: 📦 Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  # 4. Random Delay (Anti-Detection)
  - name: ⏱️ Smart Delay
    run: |
      DELAY=$(( (RANDOM % 10) + 5 ))
      echo "🕒 Waiting $DELAY minutes..."
      sleep $((DELAY * 60))
      echo "✅ Continue..."

  # 5. Generate Shorts
  - name: 🎬 Generate Shorts
    run: |
      echo "🎥 Creating videos..."
      python shorts_factory.py
      echo "✅ Shorts created"

  # 6. Upload to YouTube
  - name: 🚀 Upload Shorts
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
    run: |
      echo "📤 Uploading videos..."
      python upload_bot.py
      echo "✅ Upload finished"

  # 7. Cleanup (always runs)
  - name: 🧹 Cleanup
    if: always()
    run: |
      echo "🗑️ Cleaning videos folder..."
      rm -rf videos/* || true
      mkdir -p videos
      touch videos/.gitkeep
      echo "✨ Cleanup done"

  # 8. Failure Logs
  - name: 📧 Failure Report
    if: failure()
    run: |
      echo "❌ Workflow failed!"
      echo "🕒 Time: $(date)"
      echo "🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
```
